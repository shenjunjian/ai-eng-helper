<?xml version="1.0" encoding="UTF-8"?>
<!-- 自适应图标 · 背景层：满幅渐变，会被启动器 mask 裁剪 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAE72"/>
      <stop offset="0.45" stop-color="#FF7A50"/>
      <stop offset="1" stop-color="#E5432A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.14" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="194" y1="322" x2="332" y2="262">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#DF4526"/>
    </linearGradient>
    <clipPath id="frame"><rect width="512" height="512" rx="115.2" ry="115.2"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
</svg>
