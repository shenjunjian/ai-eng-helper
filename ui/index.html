<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkFlow · 英语对话记单词 — 移动端原型</title>
<style>
:root{
  --bg:#F5F5F3;
  --surface:#FFFFFF;
  --ink:#111318;
  --ink-2:#575D66;
  --muted:#98A0AA;
  --line:#ECECE7;
  --spark:#FF7A50;
  --spark-soft:#FFEDE4;
  --ok:#12B76A;
  --hot:#E5484D;
  --radius:22px;
  --tab-h:82px;
  --tab-h-safe:98px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,'SF Pro Display','PingFang SC','Segoe UI','Microsoft YaHei',sans-serif;
  background:#16181D;
  color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;gap:22px;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 展示外层 ---------- */
.stage-head{color:#EDEEF0;text-align:center}
.stage-head h1{font-size:20px;font-weight:600;letter-spacing:-.2px}
.stage-head p{font-size:13px;color:#7C838F;margin-top:6px}
.phone-frame{
  width:390px;height:844px;flex:none;
  background:var(--bg);
  border-radius:52px;
  border:11px solid #0B0C0F;
  box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 2px #2A2E36;
  position:relative;overflow:hidden;
}
/* 灵动岛 */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#0B0C0F;border-radius:16px;z-index:200}
.status-bar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:150;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 6px;font-size:14px;font-weight:600;color:var(--ink);
}
.status-bar .sys{display:flex;align-items:center;gap:6px}
.status-bar svg{display:block}

/* ---------- 屏幕 ---------- */
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;
  background:var(--bg);overflow:hidden;
}
.screen.active{display:flex;animation:screenIn .26s cubic-bezier(.32,.72,.28,1)}
@keyframes screenIn{from{opacity:.4;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pt-safe{padding-top:54px}
.pt-status{padding-top:54px}
.pb-tabs{padding-bottom:var(--tab-h-safe)}
.pb-plain{padding-bottom:26px}

/* ---------- 文字 ---------- */
h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
h2{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
p{color:var(--ink-2);font-size:14px;line-height:1.55}
.tiny{font-size:12px;color:var(--muted)}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:18px 20px 8px}

/* ---------- 通用件 ---------- */
.btn{border:none;background:none;font-family:inherit;font-weight:600;cursor:pointer;transition:transform .12s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink);color:#fff;border-radius:999px;padding:15px 22px;font-size:15px;width:100%}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:14px 22px;font-size:15px;width:100%}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:999px;width:auto}
.field{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;
  padding:15px 16px;font-size:16px;font-family:inherit;color:var(--ink);margin-bottom:10px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(17,19,24,.05)}
.field::placeholder{color:var(--muted)}
select.field{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2398A0AA' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 16px center}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;border:1px solid var(--line)}
.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;white-space:nowrap;
  transition:all .18s;
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.spark.on{background:var(--spark);border-color:var(--spark);color:#fff}
.avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;background:#DDD}
.avatar .glyph{font-size:26px;line-height:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--spark);flex:none}
.row{display:flex;align-items:center;gap:12px}
.tap{cursor:pointer;transition:background .15s}
.tap:active{background:#F0F0EC}

/* 列表行（会话） */
.list{background:var(--surface);border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.cell{display:flex;gap:13px;align-items:center;padding:14px 16px;position:relative;cursor:pointer;transition:background .15s}
.cell:active{background:#F6F6F3}
.cell+.cell::before{content:'';position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.cell-body{flex:1;min-width:0}
.cell-title{font-size:15.5px;font-weight:600;color:var(--ink);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.cell-time{font-size:11.5px;color:var(--muted);font-weight:600;flex:none;align-self:flex-start;margin-top:3px}

/* 设置式列表 */
.group{background:var(--surface);border-radius:20px;overflow:hidden;border:1px solid var(--line);margin:0 20px 14px}
.item{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;position:relative;transition:background .15s}
.item:active{background:#F6F6F3}
.item+.item::before{content:'';position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.item .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.item .lbl{flex:1;font-size:15px;font-weight:500;color:var(--ink)}
.item .val{font-size:13.5px;color:var(--muted)}
.chev{color:#C6CBD2;flex:none}

/* ---------- 底部页签（固定于手机壳底部） ---------- */
.tab-bar{
  position:absolute;left:0;right:0;bottom:0;z-index:120;
  height:var(--tab-h-safe);padding-bottom:24px;
  display:none;align-items:center;justify-content:space-around;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
}
.tab-bar.show{display:flex}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;
  font-size:10.5px;font-weight:600;letter-spacing:.2px;color:var(--muted);cursor:pointer;
  transition:color .2s;padding-bottom:2px;
}
.tab svg{width:24px;height:24px;transition:transform .2s}
.tab.on{color:var(--ink)}
.tab.on svg{transform:translateY(-1px)}
.home-indicator{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:128px;height:5px;border-radius:3px;background:rgba(17,19,24,.28);z-index:180;pointer-events:none;
}

/* ---------- 对话页 ---------- */
.call-head{padding:56px 18px 10px;display:flex;align-items:center;gap:12px}
.call-name{font-size:16px;font-weight:700;letter-spacing:-.2px}
.call-status{font-size:11.5px;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:5px;margin-top:2px}
.call-status .live{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:all .18s}
/* 统一图标尺寸：未显式声明 width 的 SVG 用基础尺寸，内联 style 与 width 属性可覆盖 */
.screen svg:not([width]){width:18px;height:18px;display:block;flex:none}
.screen .icon-btn svg{width:19px;height:19px}
.screen .chip svg{width:15px;height:15px}
.screen .item .ic svg{width:17px;height:17px}
.screen .hangup svg{width:27px;height:27px}
.screen .word-src svg{width:12px;height:12px}
.screen .big-ic svg{width:26px;height:26px}
.toast svg{width:16px;height:16px}
.icon-btn:active{transform:scale(.92)}
.ctrl-strip{display:flex;gap:8px;padding:2px 18px 12px;overflow-x:auto;scrollbar-width:none}
.ctrl-strip::-webkit-scrollbar{display:none}
.chat-scroll{flex:1;overflow-y:auto;padding:4px 18px 14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.chat-scroll::-webkit-scrollbar{display:none}
.msg{max-width:82%;padding:12px 15px;font-size:14.5px;line-height:1.5;animation:msgIn .3s cubic-bezier(.3,.8,.3,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 20px 7px;color:var(--ink)}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:20px 20px 7px 20px}
.msg .zh{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.msg.me .zh{color:rgba(255,255,255,.6)}
.msg.hide-zh .zh{display:none}
.wlink{color:var(--spark);font-weight:700;cursor:pointer;border-bottom:1.5px solid var(--spark-soft);transition:border-color .2s}
.wlink:hover{border-color:var(--spark)}
.wlink.saved{color:var(--ok);border-color:#D6F0E2}
.call-foot{padding:10px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(to top,var(--bg) 60%,rgba(245,245,243,0))}
.hangup{
  width:66px;height:66px;border-radius:50%;background:var(--hot);border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(229,72,77,.36);transition:transform .15s;
}
.hangup:active{transform:scale(.93)}
.timer{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}

/* 单词本 */
.word-cell{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;position:relative;transition:background .15s}
.word-cell:active{background:#F6F6F3}
.word-cell+.word-cell::before{content:'';position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.word-en{font-size:16px;font-weight:700;letter-spacing:-.2px}
.word-zh{font-size:13px;color:var(--ink-2);margin-top:2px}
.word-src{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px;cursor:pointer}
.word-src:hover{color:var(--spark)}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--spark-soft);color:#C7502A;flex:none}
.tag.phrase{background:#EDE9FE;color:#6D28D9}
.tag.done{background:#E8F7EF;color:var(--ok)}

/* 底部抽屉 */
.scrim{position:absolute;inset:0;background:rgba(11,12,15,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:220}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:230;background:var(--surface);
  border-radius:28px 28px 0 0;padding:10px 20px 30px;transform:translateY(102%);
  transition:transform .32s cubic-bezier(.32,.72,.2,1);max-height:72%;overflow-y:auto;
}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:#DCDDE2;margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.sheet .opt{display:flex;align-items:center;gap:12px;padding:14px 0;position:relative;cursor:pointer}
.sheet .opt+.opt::before{content:'';position:absolute;top:0;left:50px;right:0;height:1px;background:var(--line)}

/* 挂断总结遮罩 */
.veil{position:absolute;inset:0;z-index:250;background:rgba(11,12,15,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .26s}
.veil.show{opacity:1;pointer-events:auto}
.veil-card{display:flex;flex-direction:column;align-items:center;gap:16px}
.veil-orb{width:52px;height:52px;border-radius:50%;background:conic-gradient(from 90deg,var(--spark),#FFC48A,var(--spark));animation:spin 1.1s linear infinite;position:relative}
.veil-orb::after{content:'';position:absolute;inset:7px;border-radius:50%;background:#1B1D22}
@keyframes spin{to{transform:rotate(360deg)}}
.veil-txt{color:#fff;font-size:13.5px;font-weight:600;letter-spacing:.2px}

/* toast */
.toast{
  position:absolute;left:50%;bottom:150px;transform:translate(-50%,12px);z-index:240;
  background:rgba(17,19,24,.92);color:#fff;font-size:13px;font-weight:500;
  padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;
  display:flex;align-items:center;gap:8px;max-width:80%;text-align:left;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 启动/登录 */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 30px 60px}
.mark{width:62px;height:62px;border-radius:20px;background:var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:26px;box-shadow:0 14px 30px rgba(17,19,24,.22)}
.big-num{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat-mini{flex:1;text-align:center}
.stat-mini .k{font-size:22px;font-weight:700;letter-spacing:-.5px}
.stat-mini .v{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:7px;height:104px;padding:0 2px}
.bars i{flex:1;background:var(--line);border-radius:3px;transition:height .4s}
.bars i.hi{background:var(--ink)}
.bars i.now{background:var(--spark)}
</style>
</head>
<body>
<div class="stage-head">
  <h1>TalkFlow · 英语对话记单词</h1>
  <p>移动端交互原型 · 点击手机壳内元素体验流程</p>
</div>

<div class="phone-frame">
  <div class="island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="sys">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0M3.8 6.9a6 6 0 0 1 8.4 0"/><circle cx="8" cy="10" r="0.9" fill="currentColor" stroke="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M23.5 4.5v3a2.2 2.2 0 0 0 0-3z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div id="screens"></div>

  <!-- 底部页签：固定在手机壳（应用窗口）底部，不属于最外层页面 -->
  <nav class="tab-bar" id="tabbar"></nav>

  <div class="home-indicator"></div>
  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
  <div class="veil" id="veil">
    <div class="veil-card">
      <div class="veil-orb"></div>
      <div class="veil-txt"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
